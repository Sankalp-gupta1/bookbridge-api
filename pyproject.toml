[project]
name = "bookbridge"
version = "1.0.0"
description = "Read-only APIs reverse-engineered from a public HTML book catalogue"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "pydantic==2.13.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
